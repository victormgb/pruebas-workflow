name: Secrets Environment Workflow

on:
  workflow_dispatch:

env:
  APP_ENV: "development"

jobs:
  test:
    environment: development
    runs-on: ubuntu-latest
    env:
      TEST_LEVEL: "unit"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install dependencies
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Test
        id: run-tests
        uses: ./.github/actions/test
      - name: Report test result
        run: echo "El resultado del step anterior fue ${{ steps.run-tests.outputs.app-status }}"
      - name: Show Secret
        run: echo "El valor del secreto APP_SECRET es ${{ secrets.DB_PASSWORD }}"