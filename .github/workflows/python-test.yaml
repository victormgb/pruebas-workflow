name: Secrets Workflow

on:
  workflow_dispatch:

env:
  APP_ENV: "development"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_LEVEL: "unit"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Configure python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest -v