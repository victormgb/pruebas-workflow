name: Hello World Workflow

on: workflow_dispatch

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World
        run: echo "Hello World"

  test:
    runs-on: ubuntu-latest
    needs: hello
    if: ${{ needs.hello.result == 'success' }}
    steps:
      - name: Ejecucion de test
        run: echo "Running tests..."

  deploy:
    runs-on: self-hosted
    needs: test
    if: ${{ needs.test.result == 'success' }}
    steps:
      - name: Deploy
        run: echo "Deploying..."